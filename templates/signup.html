<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
</head>

<body>
    <div class="app-title">
        🎯 <span>AI Multimedia Analyzer</span>
    </div>

    <div style="position: relative;margin-top: 60px;">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul style="
          color: white;
          background-color: #ff4d4d;
          list-style: none;
          padding: 10px;
          margin: 0 auto 20px;
          border-radius: 5px;
          font-weight: bold;
          position: absolute;
          top: -40px;
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
          width: fit-content;
          max-width: 90%;
          z-index: 999;
        ">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <div class="signup-container">
            <form class="signup-left" method="POST" action="{{ url_for('auth_bp.signup') }}" onsubmit="return validatePassword()">
                <h2>Sign Up</h2>
                <input type="text" name="username" placeholder="User name" required>
                <input type="password" name="password" id="password" placeholder="Password" required oninput="checkPasswordStrength()">
                <div id="passwordError" style="font-size: 12px; color: yellow; margin-bottom: 10px;"></div>
                <button type="submit">Sign Up</button>
                <div class="login-text">
                    Already have an account? <a href="{{ url_for('auth_bp.login') }}">Log In</a>
                </div>
            </form>

            <div class="signup-right">
                <h1>WELCOME !</h1>
                <p>Create your account to continue</p>
                <div class="bubble bubble1"></div>
                <div class="bubble bubble2"></div>
                <div class="bubble bubble3"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
